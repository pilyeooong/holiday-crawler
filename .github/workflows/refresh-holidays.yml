name: Refresh holiday data

# 주의: GitHub 호스팅 러너(해외 IP)에서는 apis.data.go.kr 접속이 타임아웃된다(2026-09-21 확인).
# 그래서 cron은 두지 않고 수동 실행만 남긴다. 실제 갱신은 로컬(한국 IP)에서
# `python holiday_crawler.py` 실행 후 push. 한국 리전 프록시가 마련되면 schedule을 되살린다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "갱신할 연도 (공백 구분). 비우면 작년~내후년"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-holidays
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run crawler
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: python holiday_crawler.py ${{ inputs.years }}

      - name: Commit and push if holidays changed
        run: |
          if git diff --quiet -- 'holidays_*.json'; then
            echo "변경 없음 — 커밋하지 않음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holidays_*.json
          git commit -m "data: refresh holidays ($(date -u +%Y-%m-%d))"
          git push
